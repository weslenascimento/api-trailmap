name: Skill and generator checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/verify_install.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate.py --input examples/inventory.json --validate-only
